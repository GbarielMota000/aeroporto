<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Aeroporto Inteligente</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>✈️ Aeroporto Inteligente</h1>

        <div class="painel">

            <h2>Cadastro de Voo</h2>

            <input
                type="text"
                id="inputCod"
                placeholder="Código do voo"
            >

            <input
                type="text"
                id="inputDest"
                placeholder="Destino"
            >

            <button id="btnCadastrar">
                Cadastrar Voo ✈️
            </button>

        </div>


        <div class="painel">

            <h2>🛫 Voos Cadastrados</h2>

            <div id="telaPainel"></div>

        </div>

    </div>


    <!-- IMPORTANTE: type="module" -->

    <script
        type="module"
        src="main.js">
    </script>

</body>

</html>
